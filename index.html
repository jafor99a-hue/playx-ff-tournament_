<!-- Firebase App (Core) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<!-- Firebase Auth (লগইন ও সাইন-আপের জন্য) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<!-- Firebase Firestore (ডেটাবেসে তথ্য সেভ করার জন্য) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<!-- ইউজার সাইন-আপ ও গেমের তথ্য দেওয়ার ফর্ম -->
<div class="auth-container">
    <h2>ইউজার রেজিস্ট্রেশন ও টুর্নামেন্ট জয়েন</h2>
    <input type="email" id="email" placeholder="ইমেল লিখুন">
    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
    <input type="text" id="gameName" placeholder="ইন-গেম নাম (In-game Name)">
    <input type="text" id="gameUid" placeholder="ফ্রি ফায়ার ইউআইডি (Free Fire UID)">
    <button onclick="registerAndJoinTournament()">রেজিস্ট্রেশন ও জয়েন করুন</button>
</div>
